name: build sudofx shortcut

on:
  push:
    branches: [master]
    paths:
      - 'scripts/build_sudofx_shortcut.py'
      - '.github/workflows/build-shortcut.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate shortcut
        run: python scripts/build_sudofx_shortcut.py
      - name: Sign shortcut for import
        run: >-
          shortcuts sign
          --mode anyone
          --input "dist/sudofx Run Model.shortcut"
          --output "dist/sudofx Run Model signed.shortcut"
      - name: Upload signed shortcut
        uses: actions/upload-artifact@v4
        with:
          name: sudofx-run-model-shortcut
          path: "dist/sudofx Run Model signed.shortcut"
          if-no-files-found: error
