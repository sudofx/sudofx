name: sudofx - Start
run-name: "Start sudofx"

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: sudofx-operator-start
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Make sure sudofx is not already running
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runtime_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/sudofx-runtime" --jq '.object.sha')"
          active="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/prove-model.yml/runs?branch=sudofx-runtime&per_page=50" --jq '.workflow_runs[] | select(.head_branch=="sudofx-runtime" and .status!="completed") | [.head_sha, .status] | @tsv' | awk -F '\\t' -v runtime_ref="$runtime_ref" '$1 == runtime_ref && ($2 == "queued" || $2 == "in_progress" || $2 == "requested" || $2 == "waiting" || $2 == "pending") { count++ } END { print count+0 }')"
          echo "active=$active" >> "$GITHUB_OUTPUT"

      - name: Enable the continuity workflow and latch
        if: steps.status.outputs.active == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in prove-model.yml sudofx-runner.yml; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow" --jq '.state')"
            if [[ "$state" != "active" ]]; then
              gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/enable" >/dev/null
            fi
          done

      - name: Start the first continuity cycle
        if: steps.status.outputs.active == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runtime_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/sudofx-runtime" --jq '.object.sha')"
          gh workflow run prove-model.yml --repo "$GITHUB_REPOSITORY" --ref sudofx-runtime -f "dispatch_token=start-$GITHUB_RUN_ID" -f "runtime_ref=$runtime_ref" -f "operator_start=true"

      - name: Explain the result
        if: always()
        run: |
          if [[ "${{ steps.status.outputs.active }}" == "0" ]]; then
            echo "sudofx was told to start. The first continuity cycle was dispatched and the continuation latch is open." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "sudofx is already running on the current runtime, so nothing was duplicated." >> "$GITHUB_STEP_SUMMARY"
          fi
