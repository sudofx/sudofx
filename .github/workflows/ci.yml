name: sudofx — fast CI

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'plugins/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/sudofx.yml'
      - '.github/workflows/prove-model.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'plugins/**'
      - 'pyproject.toml'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: sudofx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run fast unit and sanity checks
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Verify remote operator plugin contracts
        run: node --test plugins/remote_operator/worker.test.mjs
