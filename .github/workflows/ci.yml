name: sudofx — fast CI

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'applications/**'
      - 'tests/**'
      - 'scripts/**'
      - 'experiments/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/sudofx.yml'
      - '.github/workflows/prove-model.yml'
      - '.github/workflows/operator-start.yml'
      - '.github/workflows/operator-stop.yml'
      - '.github/workflows/sudofx-runner.yml'
      - '.github/workflows/promote-runtime.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/public-live.yml'
      - '.github/workflows/phase-d-live-proof.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'applications/**'
      - 'tests/**'
      - 'scripts/**'
      - 'experiments/**'
      - 'pyproject.toml'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: sudofx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run fast unit and sanity checks
        run: PYTHONPATH=src:. python -m unittest discover -s tests -v
