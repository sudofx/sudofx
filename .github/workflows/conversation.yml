name: sudofx — conversation

# PRIVACY-BOUNDED CONVERSATION EXECUTION
#
# The browser gateway encrypts each transient message before dispatch. GitHub
# receives only ciphertext and an opaque request ID. The runner decrypts into a
# temporary file, executes the ordinary governed Conversation runtime, encrypts
# the transient assistant reply, then publishes ONLY ciphertext to the
# historyless conversation-live branch.
#
# SQLite remains authoritative for durable Conversation metadata, observations,
# governance receipts, and invocation lifecycle evidence. Neither the workflow
# input nor the reply projection is operational authority.

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Opaque Conversation request ID
        type: string
        required: true
      payload:
        description: Encrypted Conversation transport envelope
        type: string
        required: true
      model:
        description: Gemini model ID
        type: string
        default: gemini-3.5-flash-lite
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  # One authoritative writer and one disposable reply projection at a time.
  group: sudofx-authority-v4
  cancel-in-progress: false

jobs:
  converse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Verify authority and privacy boundaries
        run: PYTHONPATH=src:. python -m unittest discover -s tests -v

      - name: Run one encrypted governed Conversation turn
        env:
          GEMINI_MODEL: ${{ inputs.model }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CONVERSATION_TRANSPORT_KEY: ${{ secrets.CONVERSATION_TRANSPORT_KEY }}
          ENCRYPTED_PAYLOAD: ${{ inputs.payload }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          message_file="$RUNNER_TEMP/conversation-message.txt"
          response_file="$RUNNER_TEMP/conversation-response.txt"
          reply_file="$RUNNER_TEMP/reply.json"

          # No plaintext is written to GitHub logs, workflow metadata, artifacts,
          # repository files, or the authoritative Conversation application state.
          PYTHONPATH=src:. python -m applications.conversation.transport decrypt "$ENCRYPTED_PAYLOAD" > "$message_file"

          PYTHONPATH=src:. MESSAGE_FILE="$message_file" RESPONSE_FILE="$response_file" python - <<'PY'
          import os
          from pathlib import Path
          from applications.conversation.runtime import run_turn

          message = Path(os.environ["MESSAGE_FILE"]).read_text(encoding="utf-8")
          response = run_turn(message)
          Path(os.environ["RESPONSE_FILE"]).write_text(response, encoding="utf-8")
          PY

          rm -f "$message_file"

          PYTHONPATH=src:. python -m applications.conversation.transport reply             --response-file "$response_file"             --output-file "$reply_file"             --request-id "$REQUEST_ID"

          rm -f "$response_file"

          {
            echo "# Governed Conversation"
            echo
            echo "A privacy-bounded turn completed."
            echo
            echo "Message and assistant content are intentionally absent from this workflow summary."
            echo "Durable continuity lives in governed SQLite observations; the reply transport is encrypted and disposable."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish encrypted disposable reply
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          publish="$RUNNER_TEMP/conversation-live"
          rm -rf "$publish"
          mkdir -p "$publish"
          cd "$publish"
          git init -q
          git checkout -q -b conversation-live
          git config user.name "sudofx-bot"
          git config user.email "sudofx-bot@users.noreply.github.com"
          cp "$RUNNER_TEMP/reply.json" reply.json
          git add reply.json
          git commit -q -m "Publish encrypted Conversation reply"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git"
          # Every publication is a new root commit. conversation-live is a
          # disposable single-reply transport, not durable history.
          git push --force -q origin HEAD:conversation-live

      - name: Resume enabled continuity after conversation
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/sudofx-runner.yml" --jq '.state')"
          if [[ "$state" != "active" ]]; then
            echo "Continuity is disabled; preserving operator Stop."
            exit 0
          fi
          runtime_head="$(gh api "repos/$GITHUB_REPOSITORY/branches/sudofx-runtime" --jq '.commit.sha')"
          active_runtime="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/prove-model.yml/runs?per_page=100"             --jq --arg sha "$runtime_head" '[.workflow_runs[] | select(.head_branch == "sudofx-runtime" and .head_sha == $sha and .status != "completed")] | length')"
          if [[ "$active_runtime" -gt 0 ]]; then
            echo "A runtime continuity cycle is already active; no resume dispatch needed."
            exit 0
          fi
          gh workflow run prove-model.yml --repo "$GITHUB_REPOSITORY" --ref sudofx-runtime             -f "dispatch_token=resume-after-conversation-$GITHUB_RUN_ID"
