name: sudofx — conversation

# PHASE D HUMAN INTERACTION SURFACE
#
# This workflow is intentionally narrower than the general operator workflow.
# GitHub supplies authenticated browser input; sudofx still owns authority.
# The message is proposal material only. The conversation application governs
# the human turn, SQLite records it, the runtime invokes the provider from
# bounded database-derived context, and the assistant turn must cross the same
# deterministic application boundary before it becomes durable.
#
# The Actions page and step summary are disposable presentation surfaces. They
# are never read back to reconstruct conversation state.

on:
  workflow_dispatch:
    inputs:
      message:
        description: Message to the governed conversation
        type: string
        required: true
      model:
        description: Gemini model ID
        type: string
        default: gemini-3.5-flash-lite
        required: true

permissions:
  # The governed turn may checkpoint the authoritative SQLite state branch.
  contents: write
  # After the finite conversation turn, an already-enabled continuity runner
  # may be resumed without granting this workflow authority over its policy.
  actions: write

concurrency:
  # Conversation turns serialize with every other authoritative mutation.
  # This prevents a browser double-submit from becoming competing SQLite writers.
  group: sudofx-authority-v4
  cancel-in-progress: false

jobs:
  converse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Verify authority boundaries
        # A broken implementation must fail before operator text is committed.
        run: PYTHONPATH=src:. python -m unittest discover -s tests -v

      - name: Run one governed conversation turn
        # applications.conversation.runtime commits the human-origin turn before
        # provider invocation. If Gemini fails, durable failure evidence remains
        # and the human input is not erased or silently retried as success.
        env:
          GEMINI_MODEL: ${{ inputs.model }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MESSAGE: ${{ inputs.message }}
        run: PYTHONPATH=src:. python -m applications.conversation.runtime --message "$MESSAGE" --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Resume enabled continuity after conversation
        # Conversation is a finite operator action, not permission to start an
        # experiment that the operator previously stopped. Resume only when the
        # continuation workflow is still enabled and no runtime cycle is active.
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/sudofx-runner.yml" --jq '.state')"
          if [[ "$state" != "active" ]]; then
            echo "Continuity is disabled; preserving operator Stop."
            exit 0
          fi
          runtime_head="$(gh api "repos/$GITHUB_REPOSITORY/branches/sudofx-runtime" --jq '.commit.sha')"
          active_runtime="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/prove-model.yml/runs?per_page=100" \
            --jq --arg sha "$runtime_head" '[.workflow_runs[] | select(.head_branch == "sudofx-runtime" and .head_sha == $sha and .status != "completed")] | length')"
          if [[ "$active_runtime" -gt 0 ]]; then
            echo "A runtime continuity cycle is already active; no resume dispatch needed."
            exit 0
          fi
          gh workflow run prove-model.yml --repo "$GITHUB_REPOSITORY" --ref sudofx-runtime \
            -f "dispatch_token=resume-after-conversation-$GITHUB_RUN_ID"
