name: sudofx — refresh public live projection

# This workflow refreshes the disposable public-safe data plane only.
# It never deploys Pages and never performs a semantic mutation.
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/public-live.yml'
      - 'scripts/github_sudofx.py'
      - 'src/sudofx/record.py'
      - 'src/sudofx/applications.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sudofx-public-live
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Refresh disposable public-safe projection
        run: PYTHONPATH=src:. python scripts/github_sudofx.py --refresh-live
