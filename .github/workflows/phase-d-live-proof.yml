name: sudofx — Phase D live proof

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/phase-d-live-proof.yml'

permissions:
  contents: write

concurrency:
  group: sudofx-authority-v4
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify repository before authority mutation
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run one live governed conversation turn
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: >-
          PYTHONPATH=src python scripts/conversation_sudofx.py
          --message "This is the Phase D live continuity proof. Reply briefly with what you can know from the bounded conversation you received, and do not claim access to anything else."
          --summary-file "$GITHUB_STEP_SUMMARY"
