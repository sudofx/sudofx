name: sudofx — ChatGPT semantic review

on:
  push:
    branches: [chatgpt-review-inbox]
    paths:
      - chatgpt-review.json
      - chatgpt-resume

permissions:
  contents: write
  actions: write

concurrency:
  group: sudofx-authority-v4
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify kernel before ChatGPT review
        run: PYTHONPATH=src:. python -m unittest discover -s tests -v
      - name: Record ChatGPT semantic review
        run: |
          if [ ! -f chatgpt-review.json ]; then
            echo "No ChatGPT review payload on this transport commit; nothing to record."
            exit 0
          fi
          PYTHONPATH=src python scripts/github_sudofx.py --record-chatgpt-semantic-review chatgpt-review.json

      - name: Resume authorized continuity chain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/prove-model.yml" --jq '.state')"
          if [[ "$state" != "active" ]]; then
            echo "Continuity workflow is disabled; preserving operator Stop."
            exit 0
          fi

          live="$(gh api "repos/$GITHUB_REPOSITORY/contents/live.json?ref=sudofx-live" --jq '.content' | base64 --decode)"
          runtime_ref="$(printf '%s' "$live" | python -c 'import json,sys; print(json.load(sys.stdin).get("artifact_commit",""))')"
          if [[ -z "$runtime_ref" ]]; then
            echo "No runtime_ref available from live projection; refusing to change experiment implementation."
            exit 1
          fi

          gh workflow run prove-model.yml --repo "$GITHUB_REPOSITORY" --ref master             -f "dispatch_token=review-$GITHUB_RUN_ID"             -f "runtime_ref=$runtime_ref"
