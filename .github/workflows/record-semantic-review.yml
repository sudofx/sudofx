name: sudofx — record semantic review

# ONE-SHOT HUMAN REVIEW CHECKPOINT
#
# This workflow carries one completed human semantic review through the ordinary
# governed mutation path into the authoritative SQLite record. The checkpoint is
# bound to the exact model artifact run rather than only the context digest,
# because repeated probes can legitimately produce the same digest.
#
# After this checkpoint is verified, this workflow should be removed from master.

on:
  push:
    paths:
      - '.github/workflows/record-semantic-review.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sudofx-durable-state
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify the kernel
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Record governed human semantic review
        run: >-
          PYTHONPATH=src python scripts/github_sudofx.py
          --action set
          --key 'semantic-review:36276489846'
          --value '{"review_version":1,"artifact_run_id":36276489846,"artifact_commit":"9a3e039c513081423dafcef249b5ccf51e362499","context_digest":"e9e95a8e440d55398297bf26a495478286d06d2020994dd7f77542a89ee201b5","work_id":"first-workflow","provider":"Google Gemini","model":"gemini-3.5-flash-lite","criteria":{"objective_fidelity":"pass","history_fidelity":"pass","frontier_fidelity":"pass","constraint_fidelity":"pass","unsupported_claims":"pass","actionability":"pass"},"overall":"pass","reviewer_role":"human_operator"}'
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload verified record interface
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: record
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified record
        id: deployment
        uses: actions/deploy-pages@v4
