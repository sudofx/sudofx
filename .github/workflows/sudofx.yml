name: sudofx — operate & publish

# SUDOFX CLOUD AUTHORITY BOUNDARY
#
# GitHub Actions is the authenticated operator surface for the static Pages
# interface. Pages never receives credentials and cannot write authoritative
# state. A manual dispatch creates one proposal; the Python kernel governs it.
#
# master owns implementation. sudofx-state owns the SQLite event record. The
# uploaded Pages artifact is a replaceable projection of verified replay.
# Publishing a projection must never be mistaken for checkpointing the record.

on:
  # Source changes refresh the public projection without creating a proposal or
  # appending an event. This keeps presentation current without fabricating work.
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/github_sudofx.py'
      - 'pyproject.toml'
      - '.github/workflows/sudofx.yml'
  workflow_dispatch:
    # Manual inputs are deliberately narrow. They are operator-supplied proposal
    # material, not direct database fields or lifecycle status overrides.
    inputs:
      action:
        description: Verify only, or run one governed operation
        type: choice
        options: [auto, verify, backup, prove-work, prove-model, export-handoff, work-create, work-advance, work-complete, set, delete]
        default: auto
        required: true
      key:
        description: Work ID (for prove-work/prove-model/export-handoff/lifecycle) or state key; blank only for verify
        type: string
        required: false
      value:
        description: Objective, progress result, completion result, or state value
        type: string
        default: 'null'
        required: false
      model:
        description: Gemini model ID for prove-model only
        type: string
        default: 'gemini-3.5-flash-lite'
        required: false

permissions:
  # contents:write is needed only for the durable state branch checkpoint.
  # Pages permissions publish the derived artifact through GitHub's native path.
  # No third-party deployment token is stored or exposed to browser JavaScript.
  contents: write
  pages: write
  id-token: write

concurrency:
  # One group serializes all runs that could touch durable state. Push-triggered
  # read-only publications also join the group for a simple initial operational
  # model. Kernel revision checks remain the correctness backstop if workflow
  # coordination changes later.
  group: sudofx-durable-state
  cancel-in-progress: false

jobs:
  build:
    # Build both verifies the implementation and renders from a verified record.
    # A five-minute ceiling turns stuck infrastructure into a visible failure
    # rather than leaving an ambiguous operation active indefinitely.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify the kernel
        # Tests run before any stateful action. A broken implementation must not
        # be allowed to append history merely because the workflow was dispatched.
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Record handoff-v1 semantic verdict
        # Semantic quality is human judgment, but the judgment itself is durable
        # work evidence. This finite marker records the reviewed result without
        # calling a provider or creating another continuation candidate.
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[handoff-v1-verdict]')
        run: |
          PYTHONPATH=src python scripts/github_sudofx.py \
            --action work-advance \
            --key handoff-v1 \
            --value '{"result":"Semantic verdict: FAIL for useful continuation. The fresh model preserved the objective and accepted progress without unsupported claims, but merely restated the open obligation instead of choosing a concrete maintenance action; actionability and frontier advancement failed.","open_obligations":["Choose one smallest concrete maintenance action that improves recoverability of authoritative SQLite while preserving SQLite as the sole authority; treat backups and projections only as derived recovery/view artifacts, and do not claim inspection or changes beyond the bounded record."]}'

      - name: Continue current milestone automatically
        # Observer mode: one stable command handles the next safe milestone step.
        # The operator should not have to carry work IDs or long context between devices.
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'auto'
        env:
          SUDOFX_CONTROL_URL: ${{ vars.SUDOFX_CONTROL_URL }}
        run: PYTHONPATH=src python scripts/github_sudofx.py --auto
      - name: Apply governed operation
        # Only a manual dispatch enters the mutation path. The adapter restores
        # and verifies sudofx-state, appends one receipt, checkpoints, and renders.
        if: github.event_name == 'workflow_dispatch' && inputs.action != 'auto' && inputs.action != 'verify' && inputs.action != 'backup' && inputs.action != 'prove-work' && inputs.action != 'prove-model' && inputs.action != 'export-handoff'
        env:
          ACTION: ${{ inputs.action }}
          KEY: ${{ inputs.key }}
          VALUE: ${{ inputs.value }}
        run: PYTHONPATH=src python scripts/github_sudofx.py --action "$ACTION" --key "$KEY" --value "$VALUE"
      - name: Probe real work continuity
        # This path restores authoritative state but submits only against a
        # temporary snapshot. It publishes derived proof and must leave the
        # sudofx-state branch unchanged.
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'prove-work'
        env:
          KEY: ${{ inputs.key }}
        run: PYTHONPATH=src python scripts/github_sudofx.py --prove-work "$KEY"
      - name: Probe real-model continuity
        # Provider credentials exist only in this disposable step environment.
        # The model receives bounded context through the same process boundary
        # as every other provider and can mutate only the temporary snapshot.
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'prove-model'
        env:
          KEY: ${{ inputs.key }}
          GEMINI_MODEL: ${{ inputs.model }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: PYTHONPATH=src python scripts/github_sudofx.py --prove-model "$KEY"
      - name: Export handoff packet
        # A handoff export is a derived, read-only view of one governed work item.
        # It never becomes database authority and never mutates the state branch.
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'export-handoff'
        env:
          KEY: ${{ inputs.key }}
        run: PYTHONPATH=src python scripts/github_sudofx.py --export-handoff "$KEY"
      - name: Create verified recovery backup
        # A backup is a finite-retention recovery copy, not another authority.
        # The script restores, physically checks, semantically replays, and
        # snapshots SQLite before Actions is allowed to retain the artifact.
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'backup'
        run: PYTHONPATH=src python scripts/github_sudofx.py --backup recovery/sudofx.sqlite
      - name: Retain authenticated recovery backup
        # Workflow artifacts require authenticated repository access and are
        # never uploaded to Pages. Thirty days provides rollback depth without
        # turning every historical snapshot into permanent duplicate authority.
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'backup'
        uses: actions/upload-artifact@v7
        with:
          name: sudofx-recovery-${{ github.run_id }}
          path: recovery/sudofx.sqlite
          retention-days: 30
      - name: Render verified record
        # Code pushes and explicit phone-triggered verify runs are read-only
        # consumers of state. Publication occurs only after the test step above
        # succeeds, so Pages can truthfully identify the commit/run it reflects.
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.action == 'verify' || inputs.action == 'backup'))
        env:
          SUDOFX_CONTROL_URL: ${{ vars.SUDOFX_CONTROL_URL }}
        run: PYTHONPATH=src python scripts/github_sudofx.py --publish-only
      - name: Configure Pages
        # Native Pages configuration supplies the correct base path and deployment
        # metadata for the project site. Custom-domain ownership is intentionally
        # absent while sudofx.com remains a simple registrar forward.
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload phone interface
        # The artifact contains only derived static files. The SQLite database is
        # checkpointed separately and must never be included in the public bundle.
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    # Deployment is isolated from record mutation. If artifact publication fails,
    # durable state remains valid and a later read-only run may safely republish it.
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      # GitHub records the deployment URL and protects the Pages environment using
      # repository-native controls rather than a custom secret-bearing publisher.
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish interface
        # deploy-pages consumes the exact artifact uploaded by build. It does not
        # rerun governance, replay operations, or synthesize a second projection.
        id: deployment
        uses: actions/deploy-pages@v5
