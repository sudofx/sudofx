name: sudofx — publish public shell

# Pages contains presentation framework only.
# Changing authoritative state or live metrics must NOT trigger this workflow.
on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'scripts/build_site_shell.py'
      - '.github/workflows/pages.yml'
      - '100226-WEBSITE-CONTRACT.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sudofx-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build lightweight public shell
        run: python scripts/build_site_shell.py
      - name: Confirm shell
        run: |
          test -f site/index.html
          test -f site/applications.html
          test -f site/technical.html
          test -f site/metrics.html
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish shell
        id: deployment
        uses: actions/deploy-pages@v5
