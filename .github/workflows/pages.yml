name: sudofx — publish Pages

on:
  push:
    branches: [master]
    paths:
      - 'src/sudofx/report.py'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sudofx-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUDOFX_CONTROL_URL: ${{ vars.SUDOFX_CONTROL_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # Re-render only from authoritative state; an empty state branch is revision 0.
      - name: Render verified projection
        run: PYTHONPATH=src python scripts/github_sudofx.py --publish-only
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish interface
        id: deployment
        uses: actions/deploy-pages@v5
