name: sudofx — continue

# A caller-supplied token gives an operator an exact identity to discover.
# The cloud continuation chain uses its predecessor's immutable run ID so every
# successor remains attributable without introducing a second state authority.
run-name: sudofx continue · ${{ inputs.dispatch_token || github.run_id }}

# Stable one-tap device entry point.
#
# Existing iPhone/iPad/Mac Shortcuts dispatch this workflow with no parameters.
# It intentionally delegates operator intent to sudofx observer mode so the human
# does not carry work IDs, model IDs, or long context between devices.

on:
  # One manual dispatch starts or repairs the chain. Successful runs create one
  # successor themselves; omitting push and cron triggers prevents independent
  # chains from multiplying while continuous operation is already healthy.
  workflow_dispatch:
    inputs:
      dispatch_token:
        description: Optional correlation token for the local continuous runner
        type: string
        required: false

permissions:
  contents: write
  # The final job may dispatch this workflow and nothing else. GitHub permits
  # workflow_dispatch events created with GITHUB_TOKEN while suppressing other
  # recursive event types, which is the narrow native primitive needed here.
  actions: write
  pages: write
  id-token: write

concurrency:
  group: sudofx-durable-state
  cancel-in-progress: false

jobs:
  continue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify the kernel
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Ask Gemini and govern its response
        # This human-readable step name is also live observer telemetry. The
        # public page can truthfully say the system is waiting on Gemini while
        # this bounded provider call is active without exposing API mechanics.
        env:
          GEMINI_MODEL: gemini-3.5-flash-lite
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUDOFX_CONTROL_URL: ${{ vars.SUDOFX_CONTROL_URL }}
        run: PYTHONPATH=src python scripts/github_sudofx.py --auto
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload observer interface
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: continue
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish interface
        id: deployment
        uses: actions/deploy-pages@v4

  continue-again:
    # A successor exists only after the complete bounded cycle—including its
    # human-visible publication—succeeds. Any failure prevents this job and ends
    # the chain instead of replaying a broken or ambiguous operation forever.
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Start the next cycle immediately
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN_ID: ${{ github.run_id }}
        run: gh workflow run prove-model.yml --repo "$GITHUB_REPOSITORY" --ref master -f "dispatch_token=continuous-$PREVIOUS_RUN_ID"
