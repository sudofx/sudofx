name: sudofx — prove model

# PHONE-FIRST REAL-MODEL CONTINUITY PROBE
#
# This workflow intentionally has no operator parameters during the current
# experiment phase. Repeated runs always probe the same durable work item with
# the same Flash-Lite model, removing stale mobile form state as a variable.
#
# The probe restores and verifies production state, runs the model only against
# a temporary SQLite snapshot, publishes the derived review artifact, and never
# checkpoints the snapshot back to sudofx-state.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sudofx-durable-state
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify the kernel
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Probe Gemini Flash-Lite continuity
        env:
          GEMINI_MODEL: gemini-3.5-flash-lite
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: PYTHONPATH=src python scripts/github_sudofx.py --prove-model first-workflow
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload phone review interface
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish review interface
        id: deployment
        uses: actions/deploy-pages@v4
