name: sudofx — continue

# A caller-supplied token gives an operator an exact identity to discover.
# The cloud continuation chain uses its predecessor's immutable run ID so every
# successor remains attributable without introducing a second state authority.
run-name: sudofx continue · ${{ inputs.dispatch_token || github.run_id }}

# Stable one-tap device entry point.
#
# Existing iPhone/iPad/Mac Shortcuts dispatch this workflow with no parameters.
# GitHub Actions Start opens the continuation latch and dispatches the first
# cycle. Every successful successor is a fresh Gemini process that inherits only
# bounded, governed residue from the preceding experiment observation.
# The experiment executes only from the dedicated sudofx-runtime branch.
# master remains the development lane, so source/UI pushes cannot alter a live
# continuity series. Runtime changes require an explicit, separately verified
# promotion of sudofx-runtime.

on:
  # One manual dispatch starts or repairs the chain. Successful runs create one
  # successor themselves; omitting push and cron triggers prevents independent
  # chains from multiplying while continuous operation is already healthy.
  workflow_dispatch:
    inputs:
      dispatch_token:
        description: Optional correlation token for the local continuous runner
        type: string
        required: false
      runtime_ref:
        description: Deprecated compatibility input; runtime is pinned by sudofx-runtime
        type: string
        required: false
      operator_start:
        description: Internal explicit-Start marker for the first continuity cycle
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  # The final job may dispatch this workflow and nothing else. GitHub permits
  # workflow_dispatch events created with GITHUB_TOKEN while suppressing other
  # recursive event types, which is the narrow native primitive needed here.
  actions: write

concurrency:
  # Continuity observations share the authoritative lane with manual governed
  # mutations, but never with read-only projection refreshes. The v2 group also
  # abandons any stale scheduler lock left behind by the earlier shared lane.
  group: sudofx-authority-v4
  cancel-in-progress: false

jobs:
  continue:
    runs-on: ubuntu-latest
    if: github.ref_name == 'sudofx-runtime'
    timeout-minutes: 5
    steps:
      - name: Confirm runtime isolation
        env:
          REQUESTED_RUNTIME_REF: ${{ inputs.runtime_ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "sudofx-runtime" || {
            echo "::error::sudofx cycles may execute only from sudofx-runtime"
            exit 1
          }
          if [[ -n "$REQUESTED_RUNTIME_REF" && "$REQUESTED_RUNTIME_REF" != "$GITHUB_SHA" ]]; then
            echo "::error::Pinned runtime $REQUESTED_RUNTIME_REF does not match dispatched sudofx-runtime head $GITHUB_SHA"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ inputs.runtime_ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Ask fresh Gemini and record bounded residue
        # Model output is governed only on an isolated SQLite snapshot. The
        # production write records what the model said as untrusted experiment
        # evidence; it never advances authoritative work from provider prose.
        env:
          GEMINI_MODEL: gemini-3.5-flash-lite
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [[ "${{ inputs.operator_start }}" == "true" ]]; then
            PYTHONPATH=src python scripts/overnight_sudofx.py --operator-start
          else
            PYTHONPATH=src python scripts/overnight_sudofx.py
          fi
  continue-again:
    # A successor depends only on the completed governed continuity cycle.
    # No Pages job exists in this runtime path; the browser reads live projection
    # data independently from the replaceable sudofx-live branch.
    needs: continue
    runs-on: ubuntu-latest
    steps:
      - name: Start the next fresh Gemini cycle immediately
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN_ID: ${{ github.run_id }}
          RUNTIME_REF: ${{ github.sha }}
        run: |
          latch_state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/sudofx-runner.yml" --jq '.state' 2>/dev/null || true)"
          if [[ "$latch_state" != "active" ]]; then
            echo "Continuous runner is disabled; no successor will be dispatched."
            exit 0
          fi
          # GitHub concurrency keeps one running and one pending member, but a
          # newly dispatched successor replaces that pending member even when
          # cancel-in-progress is false. Yielding here prevents the continuous
          # chain from starving an operator/manual handoff mutation queued behind the
          # current cycle. A later explicit Start can resume the chain.
          waiting_operator_runs="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/sudofx.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')"
          waiting_chatgpt_reviews="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/chatgpt-review.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')"
          if [[ "$waiting_operator_runs" -gt 0 || "$waiting_chatgpt_reviews" -gt 0 ]]; then
            echo "Governed review/operator work is waiting; yielding the authority lane instead of replacing it."
            exit 0
          fi
          gh workflow run prove-model.yml --repo "$GITHUB_REPOSITORY" --ref sudofx-runtime -f "dispatch_token=continuous-$PREVIOUS_RUN_ID" -f "runtime_ref=$RUNTIME_REF"
